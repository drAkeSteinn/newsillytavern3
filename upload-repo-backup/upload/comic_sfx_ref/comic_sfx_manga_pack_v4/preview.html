<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Comic SFX Manga Pack v3 Preview</title>
<style>
  @font-face { font-family: KOMIKAHB; src: url('./KOMIKAHB.ttf') format('truetype'); font-display: swap; }
  body{margin:0;background:#f3f3ef;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#111;}
  header{padding:22px 26px 8px;} h1{margin:0;font-size:24px} p{margin:6px 0 0;opacity:.72}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;padding:20px 26px 26px;}
  .card{background:white;border:1px solid #ddd;border-radius:14px;padding:12px;box-shadow:0 12px 24px rgba(0,0,0,.06);min-height:280px;position:relative;overflow:hidden;}
  .card h2{font-size:13px;margin:0 0 8px;color:#333;font-weight:650;}
  iframe{border:0;width:100%;height:245px;background:transparent;}
  .tools{padding:0 26px 8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{border:1px solid #111;background:#111;color:white;border-radius:999px;padding:9px 14px;cursor:pointer}
  input,select{border:1px solid #bbb;border-radius:999px;padding:9px 12px;background:#fff;}
  #dynamic{width:180px;height:240px;margin:10px auto 0;display:grid;place-items:center;}
</style>
</head>
<body>
<header>
  <h1>Comic SFX Manga Pack v3</h1>
  <p>Animaciones SVG de una sola reproducción. Para ver la fuente exacta, coloca KOMIKAHB.ttf junto a este HTML o usa tu fuente cargada en la app.</p>
</header>
<div class="tools">
  <button onclick="replayAll()">Reproducir otra vez</button>
  <input id="txt" value="movah" maxlength="12" />
  <select id="preset"><option value="oval">oval</option><option value="vertical">vertical</option><option value="wail">wail</option><option value="tall">tall</option></select>
  <button onclick="renderDynamic()">Probar texto dinámico</button>
</div>
<div class="grid" id="grid"></div>
<script src="./js/comic-sfx-factory-v3.js"></script>
<script>
const svgs = [
  '01_mhi_vertical_breath.svg','02_egh_gasp.svg','03_big_mhh_hearts.svg','04_movah_oval_whisper.svg',
  '05_obgh_arrow.svg','06_oooh_question.svg','07_bho_side.svg','08_template_dynamic.svg'
];
function replayAll(){
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  svgs.forEach(name=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<h2>${name}</h2><iframe src="./svg/${name}?t=${Date.now()}"></iframe>`;
    grid.appendChild(card);
  });
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<h2>dynamic factory</h2><div id="dynamic"></div>';
  grid.appendChild(card);
  renderDynamic();
}
function renderDynamic(){
  const text=document.getElementById('txt').value || 'sfx';
  const preset=document.getElementById('preset').value;
  mountComicSFX(document.getElementById('dynamic'), { text, preset, vertical:preset==='vertical', duration:900 });
}
replayAll();
</script>
</body>
</html>
